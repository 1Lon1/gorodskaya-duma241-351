
name: Lab5 CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab5-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: All checks inside Docker-in-Docker
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:27-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        ports:
          - 2375:2375
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s

    env:
      DOCKER_HOST: tcp://127.0.0.1:2375
      DOCKER_TLS_CERTDIR: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Docker daemon
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image with dependency cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          tags: lab5-ci:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run quality, tests, migrations and dependency audit
        id: quality
        continue-on-error: true
        run: |
          set +e

          mkdir -p reports

          docker create --name lab5-quality lab5-ci:${{ github.sha }}
          docker start -a lab5-quality
          QUALITY_STATUS=$?

          docker cp lab5-quality:/app/reports/. reports/ || true
          docker rm lab5-quality

          echo "quality_status=$QUALITY_STATUS" >> "$GITHUB_OUTPUT"

          exit "$QUALITY_STATUS"

      - name: Scan repository for secrets with Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          set +e

          docker create \
            --name lab5-gitleaks \
            zricethezav/gitleaks:v8.24.2 \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/tmp/gitleaks.json \
            --exit-code=1

          docker cp "$GITHUB_WORKSPACE/." lab5-gitleaks:/repo

          docker start -a lab5-gitleaks
          GITLEAKS_STATUS=$?

          docker cp lab5-gitleaks:/tmp/gitleaks.json reports/gitleaks.json || true
          docker rm lab5-gitleaks

          echo "gitleaks_status=$GITLEAKS_STATUS" >> "$GITHUB_OUTPUT"

          exit "$GITLEAKS_STATUS"

      - name: Build application image inside DinD
        id: app-build
        continue-on-error: true
        run: |
          docker build --build-arg APP_REVISION=${{ github.sha }} -t lab5-api:${{ github.sha }} .
          docker save lab5-api:${{ github.sha }} -o lab5-api.tar

      - name: Scan application image with Trivy inside DinD
        id: trivy
        if: always() && steps.app-build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e

          docker create \
            --name lab5-trivy \
            aquasec/trivy:0.70.0 \
            image \
            --input /tmp/lab5-api.tar \
            --format json \
            --output /tmp/trivy.json \
            --exit-code 1 \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity HIGH,CRITICAL

          docker cp lab5-api.tar lab5-trivy:/tmp/lab5-api.tar

          docker start -a lab5-trivy
          TRIVY_STATUS=$?

          docker cp lab5-trivy:/tmp/trivy.json reports/trivy.json || true
          docker rm lab5-trivy

          echo "trivy_status=$TRIVY_STATUS" >> "$GITHUB_OUTPUT"

          exit "$TRIVY_STATUS"

      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab5-ci-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce mandatory checks
        if: always()
        run: |
          if [[ "${{ steps.quality.outcome }}" != "success" ]]; then
            echo "Quality, tests, migrations or dependency audit failed"
            exit 1
          fi

          if [[ "${{ steps.gitleaks.outcome }}" != "success" ]]; then
            echo "Gitleaks secret scan failed"
            exit 1
          fi

          if [[ "${{ steps.app-build.outcome }}" != "success" ]]; then
            echo "Application image build failed"
            exit 1
          fi

          if [[ "${{ steps.trivy.outcome }}" != "success" ]]; then
            echo "Trivy image scan failed"
            exit 1
          fi

          echo "All mandatory checks passed"

  publish:
    name: Publish image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: checks

    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_REVISION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/1lon1/gorodskaya-duma241-351:${{ github.sha }}
            ghcr.io/1lon1/gorodskaya-duma241-351:latest
